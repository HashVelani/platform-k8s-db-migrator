name: Build init-container

on:
  push:
    branches:
      - main
    tags:
      - "v*"

env:
  DOCKERHUB_REPOSITORY: hashvelani/platform-k8s-db-migrator

jobs:
  build-and-push:
    name: Build and push init-container image
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: init-container/go.mod
          cache-dependency-path: init-container/go.sum

      - name: Run tests
        working-directory: init-container
        run: go test ./...

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Determine image tags
        id: tags
        run: |
          SHA_TAG="${DOCKERHUB_REPOSITORY}:${{ github.sha }}"
          TAGS="$SHA_TAG"

          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            TAGS="$TAGS,${DOCKERHUB_REPOSITORY}:latest"
          fi

          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            SEMVER="${GITHUB_REF_NAME}"
            TAGS="$TAGS,${DOCKERHUB_REPOSITORY}:${SEMVER}"
          fi

          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: init-container
          file: init-container/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}
