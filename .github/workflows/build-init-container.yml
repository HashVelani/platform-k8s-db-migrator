name: Build init-container

on:
  push:
    branches:
      - main
    tags:
      - "v*"

env:
  ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
  ECR_REPOSITORY: platform-k8s-db-migrator/init-container

jobs:
  build-and-push:
    name: Build and push init-container image
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # required for OIDC authentication to AWS
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: init-container/go.mod
          cache-dependency-path: init-container/go.sum

      - name: Run tests
        working-directory: init-container
        run: go test ./...

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: eu-west-1

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Determine image tags
        id: tags
        run: |
          SHA_TAG="${ECR_REGISTRY}/${ECR_REPOSITORY}:${{ github.sha }}"
          TAGS="$SHA_TAG"

          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            TAGS="$TAGS,${ECR_REGISTRY}/${ECR_REPOSITORY}:latest"
          fi

          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            SEMVER="${GITHUB_REF_NAME}"
            TAGS="$TAGS,${ECR_REGISTRY}/${ECR_REPOSITORY}:${SEMVER}"
          fi

          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: init-container
          file: init-container/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}
