name: Build init-container

on:
  push:
    branches:
      - "**"   # tests run on every branch push; image is only built/pushed on main (see build-and-push)
    tags:
      - "v*"   # semver release — build, push, and smoke-test the image
  pull_request:
    branches:
      - main

env:
  DOCKERHUB_REPOSITORY: hashvelani/platform-k8s-db-migrator

jobs:
  # ── 1. Unit tests + coverage report (every branch, every PR) ────────────────
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: init-container/go.mod
          cache-dependency-path: init-container/go.sum

      - name: Run unit tests with coverage
        working-directory: init-container
        run: |
          go test -v -race -count=1 \
            -coverprofile=coverage.out \
            -covermode=atomic \
            ./...

      - name: Print per-function coverage to log
        working-directory: init-container
        run: go tool cover -func=coverage.out

      - name: Write coverage summary to job summary
        working-directory: init-container
        run: |
          echo "## 📊 Unit Test Coverage" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Package / Function | Coverage |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          go tool cover -func=coverage.out | awk '
            NR > 1 {
              gsub(/github\.com\/your-org\/platform-k8s-db-migrator\/init-container\//, "", $1)
              pct_str = $NF
              pct = pct_str
              gsub(/%$/, "", pct)
              cov = pct + 0
              if (cov >= 100.0)     icon = "🟢"
              else if (cov >= 80.0) icon = "🟡"
              else                  icon = "🔴"
              printf "| `%s` | %s %s |\n", $1, icon, pct_str
            }
          ' >> "$GITHUB_STEP_SUMMARY"

      - name: Generate HTML coverage report
        working-directory: init-container
        run: go tool cover -html=coverage.out -o coverage.html

      - name: Upload coverage report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            init-container/coverage.out
            init-container/coverage.html
          retention-days: 30

  # ── 2. Integration tests (every branch, every PR) ───────────────────────────
  integration-tests:
    name: Integration tests
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: init-container/go.mod
          cache-dependency-path: init-container/go.sum

      - name: Run integration tests with coverage
        working-directory: init-container
        run: |
          go test -v -race -count=1 -tags=integration \
            -coverprofile=coverage-integration.out \
            -covermode=atomic \
            ./...

      - name: Print per-function integration coverage to log
        working-directory: init-container
        run: go tool cover -func=coverage-integration.out

      - name: Write integration coverage summary to job summary
        working-directory: init-container
        run: |
          echo "## 📊 Integration Test Coverage" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Package / Function | Coverage |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          go tool cover -func=coverage-integration.out | awk '
            NR > 1 {
              gsub(/github\.com\/your-org\/platform-k8s-db-migrator\/init-container\//, "", $1)
              pct_str = $NF
              pct = pct_str
              gsub(/%$/, "", pct)
              cov = pct + 0
              if (cov >= 100.0)     icon = "🟢"
              else if (cov >= 80.0) icon = "🟡"
              else                  icon = "🔴"
              printf "| `%s` | %s %s |\n", $1, icon, pct_str
            }
          ' >> "$GITHUB_STEP_SUMMARY"

      - name: Generate HTML integration coverage report
        working-directory: init-container
        run: go tool cover -html=coverage-integration.out -o coverage-integration.html

      - name: Upload integration coverage report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-integration-report
          path: |
            init-container/coverage-integration.out
            init-container/coverage-integration.html
          retention-days: 30

  # ── 3. Build, push, smoke-test — main branch and semver tags only ───────────
  #
  # Feature branches: this job is skipped. Tests above still run.
  # main push:   auto-bumps patch from latest semver tag in the repo.
  #              image tagged  <repo>:<short-sha>  +  <repo>:<semver>  +  <repo>:latest
  #              repo tagged   sha-<short-sha>  +  <semver>
  # v* tag push: uses the pushed tag as the semver (no auto-bump).
  #              image tagged  <repo>:<short-sha>  +  <repo>:<semver>  +  <repo>:latest
  #              repo tagged   sha-<short-sha>  (semver tag already exists)
  build-and-push:
    name: Build, push and smoke-test image
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: smoketest
          POSTGRES_USER: smoketest
          POSTGRES_PASSWORD: smoketest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U smoketest"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-tags: true   # required to read existing semver tags for auto-bump

      - name: Install buildah
        run: |
          sudo apt-get update -y
          sudo apt-get install -y buildah

      - name: Log in to Docker Hub
        env:
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          printf '%s' "${DOCKER_PASSWORD}" | buildah login --username "${{ secrets.DOCKER_USERNAME }}" --password-stdin docker.io

      - name: Determine next semver
        id: semver
        run: |
          SHORT_SHA="${GITHUB_SHA:0:7}"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            # Explicit semver tag push — use the pushed tag directly.
            echo "semver=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            # main branch push — inspect existing semver tags and bump patch.
            # Use grep to enforce strict vMAJOR.MINOR.PATCH format, ruling out
            # tags like v1.2.3.4 or v1.2.x that would break arithmetic expansion.
            LATEST=$(git tag -l 'v*' \
              | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
              | sort -V \
              | tail -1)
            if [[ -z "${LATEST}" ]]; then
              NEXT="v0.1.0"
            else
              IFS='.' read -r MAJOR MINOR PATCH <<< "${LATEST#v}"
              if ! [[ "${MAJOR}" =~ ^[0-9]+$ && "${MINOR}" =~ ^[0-9]+$ && "${PATCH}" =~ ^[0-9]+$ ]]; then
                echo "ERROR: could not parse semver components from tag '${LATEST}'" >&2
                exit 1
              fi
              NEXT="v${MAJOR}.${MINOR}.$(( PATCH + 1 ))"
            fi
            echo "semver=${NEXT}" >> "$GITHUB_OUTPUT"
          fi

      - name: Determine image tags
        id: tags
        run: |
          SHORT_SHA="${{ steps.semver.outputs.short_sha }}"
          SEMVER="${{ steps.semver.outputs.semver }}"
          SHA_TAG="${DOCKERHUB_REPOSITORY}:${SHORT_SHA}"

          # Docker tags use plain numeric semver (e.g. 1.0.0) without the
          # leading 'v' — the v prefix is kept only on the git tag.
          DOCKER_SEMVER="${SEMVER#v}"

          # Every build gets shortsha + semver + latest so every image is
          # addressable by commit, by release version, and as the current tip.
          TAGS="${SHA_TAG},${DOCKERHUB_REPOSITORY}:${DOCKER_SEMVER},${DOCKERHUB_REPOSITORY}:latest"

          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
          # The short-SHA tag is always produced; use it to pull the image in
          # the smoke test so we know we're testing exactly what was just pushed.
          echo "primary=${SHA_TAG}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "semver=${SEMVER}" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        run: |
          buildah bud -t platform-k8s-db-migrator:latest -f init-container/Dockerfile init-container

      - name: Tag and push Docker image
        run: |
          set -e
          IFS=',' read -ra TAG_LIST <<< "${{ steps.tags.outputs.tags }}"
          for tag in "${TAG_LIST[@]}"; do
            buildah tag platform-k8s-db-migrator:latest "${tag}"
            buildah push "${tag}" "docker://${tag}"
          done

      - name: Tag repo with shortsha and semver
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          SHORT_SHA="${{ steps.semver.outputs.short_sha }}"
          SEMVER="${{ steps.semver.outputs.semver }}"

          # Short SHA tag — named after the commit SHA so it always refers to the
          # same commit; force-push is safe and makes re-runs idempotent.
          git tag -f "sha-${SHORT_SHA}"
          git push origin "sha-${SHORT_SHA}" --force

          # Semver tag — only create and push on main branch pushes.
          # For v* tag pushes the tag already exists (it triggered this run).
          if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            git tag "${SEMVER}"
            git push origin "${SEMVER}"
          fi

      - name: Annotate build summary with image tags
        run: |
          echo "## 🐳 Image Published" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Short SHA:** \`${{ steps.semver.outputs.short_sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "**Semver:** \`${{ steps.semver.outputs.semver }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Tags pushed:**" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.tags.outputs.tags }}" | tr ',' '\n' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      # ── Container smoke test ────────────────────────────────────────────────
      - name: Prepare smoke-test directories
        run: |
          mkdir -p /tmp/smoke/src /tmp/smoke/dest
          printf '%s\n' \
            '<?xml version="1.0" encoding="UTF-8"?>' \
            '<databaseChangeLog xmlns="http://www.liquibase.org/xml/ns/dbchangelog">' \
            '  <changeSet id="1-smoke" author="ci">' \
            '    <createTable tableName="smoke_test">' \
            '      <column name="id" type="BIGINT"/>' \
            '    </createTable>' \
            '  </changeSet>' \
            '</databaseChangeLog>' \
            > /tmp/smoke/src/changelog-master.xml

      - name: Smoke test — fresh database expects action=update
        run: |
          docker run --rm \
            --network host \
            -v /tmp/smoke/src:/db/changelog:ro \
            -v /tmp/smoke/dest:/changelogs \
            -e CHANGELOG_SOURCE_PATH=/db/changelog \
            -e CHANGELOG_DEST_PATH=/changelogs \
            -e SERVICE_NAME=smoke-test \
            -e SERVICE_IMAGE=smoke-test:latest \
            -e 'SPRING_DATASOURCE_URL=jdbc:postgresql://localhost:5432/smoketest?sslmode=disable' \
            -e SPRING_DATASOURCE_USERNAME=smoketest \
            -e SPRING_DATASOURCE_PASSWORD=smoketest \
            "${{ steps.tags.outputs.primary }}"

          ACTION=$(cat /tmp/smoke/dest/migration-action.txt)
          echo "Smoke test action: ${ACTION}"
          if [[ "${ACTION}" != "update" ]]; then
            echo "ERROR: expected action=update for fresh database, got: ${ACTION}"
            exit 1
          fi

      - name: Smoke test — no changelog files exits gracefully
        run: |
          EMPTY_SRC=$(mktemp -d)
          EMPTY_DEST=$(mktemp -d)

          docker run --rm \
            --network host \
            -v "${EMPTY_SRC}":/db/changelog:ro \
            -v "${EMPTY_DEST}":/changelogs \
            -e CHANGELOG_SOURCE_PATH=/db/changelog \
            -e CHANGELOG_DEST_PATH=/changelogs \
            -e SERVICE_NAME=smoke-test-no-changelogs \
            -e SERVICE_IMAGE=smoke-test:latest \
            -e 'SPRING_DATASOURCE_URL=jdbc:postgresql://localhost:5432/smoketest?sslmode=disable' \
            -e SPRING_DATASOURCE_USERNAME=smoketest \
            -e SPRING_DATASOURCE_PASSWORD=smoketest \
            "${{ steps.tags.outputs.primary }}"

          if [[ -f "${EMPTY_DEST}/migration-action.txt" ]]; then
            echo "ERROR: migration-action.txt must not be written when no changelog files exist"
            exit 1
          fi
          echo "Smoke test passed: graceful exit with no changelog files"

      - name: Smoke test — missing source path exits gracefully
        run: |
          MISSING_DEST=$(mktemp -d)

          # Do NOT mount /db/changelog — the path must not exist in the container.
          docker run --rm \
            --network host \
            -v "${MISSING_DEST}":/changelogs \
            -e CHANGELOG_SOURCE_PATH=/db/changelog \
            -e CHANGELOG_DEST_PATH=/changelogs \
            -e SERVICE_NAME=smoke-test-missing-path \
            -e SERVICE_IMAGE=smoke-test:latest \
            -e 'SPRING_DATASOURCE_URL=jdbc:postgresql://localhost:5432/smoketest?sslmode=disable' \
            -e SPRING_DATASOURCE_USERNAME=smoketest \
            -e SPRING_DATASOURCE_PASSWORD=smoketest \
            "${{ steps.tags.outputs.primary }}"

          if [[ -f "${MISSING_DEST}/migration-action.txt" ]]; then
            echo "ERROR: migration-action.txt must not be written when source path does not exist"
            exit 1
          fi
          echo "Smoke test passed: graceful exit with missing source path"

      - name: Prune images
        if: always()
        run: |
          if command -v podman >/dev/null 2>&1; then
            podman image prune -f
          else
            echo "podman not installed; skipping image prune"
          fi

