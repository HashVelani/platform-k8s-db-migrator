# Opaque secret that exposes the Liquibase admin password under the key name
# the platform init container expects: SPRING_DATASOURCE_PASSWORD.
#
# Why a separate secret?
#   The CloudNative-PG operator reads the bootstrap secret
#   (reference-service-db-admin) with type kubernetes.io/basic-auth and keys
#   "username" / "password". That type and those key names cannot be changed
#   without the CNPG operator rejecting the Cluster resource. This Opaque
#   secret holds the same password value under the key the init container needs.
#
# Keep this value in sync with reference-service-db-admin → password.
# Both refer to the reference_service_admin PostgreSQL role.
#
# Production tip: use External Secrets Operator or Vault Agent to project the
# same upstream secret into both Kubernetes secrets from a single source of
# truth instead of duplicating the value here.
apiVersion: v1
kind: Secret
metadata:
  name: reference-service-liquibase-secret
  namespace: projects
type: Opaque
stringData:
  SPRING_DATASOURCE_PASSWORD: "CHANGE_ME_ADMIN"
