# ArgoCD PreSync hook — runs BEFORE every sync of reference-service.
#
# ── How ArgoCD hook + wave ordering works ────────────────────────────────────
#
# ArgoCD divides a sync operation into phases:
#   PreSync  → hook resources run BEFORE the Sync phase starts
#   Sync     → normal manifests (Deployments, Services, …) are applied
#   PostSync → hook resources run AFTER all Sync resources are healthy
#
# Within each phase, sync-waves control ordering.  Resources at wave N must all
# be Healthy / Succeeded before ArgoCD advances to wave N+1.  Waves are shared
# across phases, so a PreSync hook at wave 0 is held back until all Sync-phase
# resources at wave -1 have become Healthy first.
#
# Wave ordering for a full reference-service deployment:
#   wave -2 : DB Secrets (db-admin, db-user, db-ro-user)
#             Applied first so CNPG can consume them during bootstrap.
#   wave -1 : CNPG Cluster + reference-service-db-config ConfigMap
#             ArgoCD waits until the Cluster reports Healthy (all Pods ready,
#             primary elected) before advancing — the database is now accepting
#             connections.
#   wave  0 : THIS migration Job (PreSync hook)
#             Runs after the DB is confirmed healthy.  Applies any pending
#             Liquibase changesets.  ArgoCD waits for the Job to Succeed before
#             starting the Sync phase.
#   wave  1 : reference-service Deployment (Sync phase)
#             Starts only after the migration Job has Succeeded, guaranteeing
#             the schema is ready before any application Pod boots.
#
# ── Inside the migration Job ──────────────────────────────────────────────────
#
# Kubernetes runs init containers sequentially (each must exit 0 before the
# next starts) and then runs main containers in parallel.  This Job uses two
# init containers + one main container:
#
#   Init 1 — copy-changelogs
#     Runs the SERVICE image with its entrypoint replaced by a plain `cp`.
#     The JVM never starts; no Spring context; no application code executes.
#     Copies /db/changelog/ (baked into the service image at build time) into
#     the shared emptyDir volume at /changelogs, then exits 0.
#
#   Init 2 — init-changelogs  (platform-k8s-db-migrator image — THIS REPO)
#     CHANGELOG_SOURCE_PATH and CHANGELOG_DEST_PATH are BOTH set to /changelogs
#     because copy-changelogs already populated the emptyDir.  The init
#     container detects src == dest and skips the copy step (self-copy guard).
#     It then:
#       • Counts changeset elements in the XML files under /changelogs.
#       • Queries DATABASECHANGELOG to count applied changesets.
#       • Writes one of {update, none} to /changelogs/migration-action.txt.
#
#   Main — liquibase  (liquibase/liquibase official image)
#     Reads migration-action.txt written by init-changelogs.
#     If action == "update" → runs `liquibase update` to apply pending changesets.
#     If action == "none"   → DB is already up to date; skips Liquibase; exits 0.
#     Connects with DDL-privileged admin credentials from the Secret.
#
# ── Hook delete policy ────────────────────────────────────────────────────────
#
# BeforeHookCreation deletes the previous Job object before creating a new one
# on every sync.  This keeps the namespace clean and avoids "already exists"
# errors when ArgoCD retries or the image tag is unchanged.
#
# ── Credentials ───────────────────────────────────────────────────────────────
#   URL + username → reference-service-db-config ConfigMap (envFrom)
#   Password       → reference-service-db-admin Secret     (secretKeyRef)
#
# ── Updating the service image tag ───────────────────────────────────────────
#   Update SERVICE_IMAGE env var in init-changelogs AND the image field of
#   copy-changelogs AND deployment.yaml to match.
---
apiVersion: batch/v1
kind: Job
metadata:
  name: reference-service-db-migration
  namespace: projects
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "0"
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app: reference-service-db-migration
    spec:
      serviceAccountName: migration-trigger-sa
      restartPolicy: Never
      imagePullSecrets:
        - name: dockerhub
      volumes:
        - name: changelogs
          emptyDir: {}
      initContainers:
        # ── Init 1: copy-changelogs ─────────────────────────────────────────
        # Runs the SERVICE image with its entrypoint replaced by a plain `cp`.
        # The JVM never starts; no Spring context; no application code runs.
        # Copies /db/changelog/ (baked into the service image) into the shared
        # emptyDir at /changelogs and exits 0.
        # Must match the image tag in the Deployment.
        - name: copy-changelogs
          image: hashvelani/reference-service-internal:v0.1.6
          command: ["cp", "-r", "/db/changelog/.", "/changelogs/"]
          volumeMounts:
            - name: changelogs
              mountPath: /changelogs

        # ── Init 2: init-changelogs ─────────────────────────────────────────
        # Runs AFTER copy-changelogs exits 0.
        # CHANGELOG_SOURCE_PATH == CHANGELOG_DEST_PATH == /changelogs because
        # the file copy was already done above.  The platform container detects
        # src == dest and skips the copy step (self-copy guard), then:
        #   • Counts changeset elements in the XML files under /changelogs.
        #   • Queries DATABASECHANGELOG to count applied changesets.
        #   • Writes {update|none} to /changelogs/migration-action.txt.
        - name: init-changelogs
          image: hashvelani/platform-k8s-db-migrator:0.1.4
          env:
            - name: CHANGELOG_SOURCE_PATH
              value: /changelogs
            - name: CHANGELOG_DEST_PATH
              value: /changelogs
            - name: SERVICE_NAME
              value: reference-service
            - name: SERVICE_IMAGE
              value: hashvelani/reference-service-internal:v0.1.6
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: reference-service-db-admin
                  key: password
          envFrom:
            - configMapRef:
                name: reference-service-db-config
          volumeMounts:
            - name: changelogs
              mountPath: /changelogs

      containers:
        # ── Main: liquibase ─────────────────────────────────────────────────
        # Runs AFTER both init containers exit 0.
        # Reads /changelogs/migration-action.txt written by init-changelogs:
        #   update → runs `liquibase update` to apply pending changesets.
        #   none   → DB already up to date; skips Liquibase; exits 0.
        # Connects with DDL-privileged admin credentials from the Secret.
        # Pin to an immutable tag — never use `latest` (supply-chain risk).
        - name: liquibase
          image: liquibase/liquibase:4.29.2
          args:
            - --searchPath=/changelogs
            - --changeLogFile=db.changelog-master.xml
            - --url=$(SPRING_DATASOURCE_URL)
            - --username=$(SPRING_DATASOURCE_USERNAME)
            - --password=$(SPRING_DATASOURCE_PASSWORD)
            - update
          env:
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: reference-service-db-admin
                  key: password
          envFrom:
            - configMapRef:
                name: reference-service-db-config
          volumeMounts:
            - name: changelogs
              mountPath: /changelogs
