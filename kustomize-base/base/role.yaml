apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: migration-job-creator
  namespace: placeholder
  labels:
    platform/managed: "true"
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "watch", "list"]
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
